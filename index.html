<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Accueil - Robbie Lens Photographie</title>
        <link rel="stylesheet" href="assets/css/index.css">
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel = "icon" href="letter-r.ico" type="image/x-icon" title="Letter r icons created by Md Tanvirul Haque - Flaticon">
    </head>
    <body>
        <header>
            <nav>
                <img src="images/logo.png" alt="Logo" id="logo">
                <div class="liens">
                    <a href="#">Accueil</a>
                    <a href="pages/a-propos.html">À-propos</a>
                    <a href="pages/portfolio.html">Portfolio</a>
                </div>
            </nav>
        </header>
            
        <main>
            <section class="accueil-intro">
                <div>
                    <h1>Robbie Lens Photographie</h1> 
                    <p>Où <em>professionalisme</em> s’allie avec <em>passion</em>. Depuis plus de 5 ans maintenant, j’exerce mon métier avec la passion
                    qui m’anime : capturer l’essence de chaque instant.</p>
                    <a class="new-item" href="#contact-formular">UN PROJET ? ÉCRIVEZ-MOI</a>       
                </div>
                <div>
                    <img src="images/robbie-lens.png" alt="Photo de Robbie Lens">    
                </div>
            </section>

            <section class="accueil-photos">
                <h2>Mon dernier projet</h2>
                <div>
                    <img src="images/acceuil/element-1.png" alt="paysage-1">
                    <img src="images/acceuil/element-2.png" alt="paysage-2">
                    <img src="images/acceuil/element-3.png" alt="paysage-3">
                </div>
                <div>
                    <img src="images/acceuil/element-4.png" alt="paysage-4">
                    <img src="images/acceuil/element-5.png" alt="paysage-5">
                    <img src="images/acceuil/element-6.png" alt="paysage-6">
                </div>
            </section>

            <section class="section-contact" id="contact-formular">
                <h2>Parlons de votre projet</h2>
                <form action="" method="get">
                    <div class="form-nom-email">
                        <div class="form-column">
                            <label for="nom">nom*</label>
                            <input type="text" name="nom" id="nom" placeholder="Ex: Max Mustermann" required>    
                        </div>
                        <div class="form-column">
                            <label for="mail">email*</label>
                            <input type="email" name="mail" placeholder="max-mustermann@gmail.com" required>
                        </div>
                    </div>
                    <label for="message">message</label>
                    <textarea name="message" id="message" rows="10">Saisissez votre message ici.</textarea>

                    <input type="submit" value="Envoyer" class="new-item">
                </form>
            </section>
        </main>

        <footer>
            <img src="images/logo.png" alt="Logo" id="logo">
            <div>
                <a href="https://x.com/" target="_blank" class="lien-icone">
                    <img src="images/twitter.png" alt=" Logo de Twitter">
                </a>
                <a href="https://www.instagram.com/" target="_blank" class="lien-icone">
                    <img src="images/instagram.png" alt="Logo d'Instagram">
                </a>         
            </div>
        </footer>
    </body>
</html>
